version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Hatchling 1.28+ emits Core Metadata 2.5, unsupported by Twine 6.2.
      - dependency-name: hatchling
        versions:
          - ">=1.28"
