[build-system]
requires = ["hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[project]
name = "acrocontract"
version = "0.1.0"
description = "Contract tests for versioned PDF AcroForms"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "KanadeK" }]
keywords = ["pdf", "acroform", "contract-testing", "rpa", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pypdf>=6.15,<7",
  "rich>=15,<16",
  "typer>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "reportlab>=4.4,<6",
  "ruff>=0.14,<0.15",
  "twine>=6.2,<7",
]

[project.scripts]
acrocontract = "acrocontract.cli:app"

[project.urls]
Homepage = "https://github.com/KanadeK/acrocontract"
Changelog = "https://github.com/KanadeK/acrocontract/blob/main/CHANGELOG.md"
Documentation = "https://github.com/KanadeK/acrocontract#readme"
Issues = "https://github.com/KanadeK/acrocontract/issues"
Source = "https://github.com/KanadeK/acrocontract"

[tool.hatch.build.targets.wheel]
packages = ["src/acrocontract"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["acrocontract"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["acrocontract"]

[tool.uv]
package = true
